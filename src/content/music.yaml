# The Archive's soundtrack: cozy lo-fi, made live in the browser (no audio files).
# Each mood is a loop of chords. Chords are note names with octaves (C4 = middle C).
# bpm: tempo. swing: 0 (straight) to 0.33 (lazy). melody: notes the wandering
# melody may pick from. drums: one bar of 16 steps; x = hit, . = rest.
default: title
