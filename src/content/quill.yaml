# Quill's fixed lines for game events. Lists are picked from at random.
swift:
  - 'Swift casting. Even I was impressed, briefly.'
  - 'Swift casting. The Archivist worked like that.'
  - 'Swift casting. Show-off.'
  - 'Swift casting. Not a single wasted word.'
  - 'Swift casting. You did that faster than I could have explained it.'
  - 'Swift casting. The Lexicon barely had time to blink.'
  - 'Swift casting. If there were a prize, I would give it to you, and then take it back to polish it.'
  - 'Swift casting. Quick and clean. lionX could learn something.'
  - 'Swift casting. I had a whole speech ready. Never mind.'
  - 'Swift casting. Fluent, that is the word.'
dutyDone:
  - 'Mended. The stacks breathe a little easier.'
  - 'Done. One less hole in the story.'
  - 'Good. The Corruption will be back, but not here, not tonight.'
  - 'Neatly done. The Archivist would have nodded. Once. That was a lot, for them.'
  - 'There. The Archive remembers that bit properly again.'
  - 'Good work. I felt that one settle into place.'
  - 'Mended. Somewhere a page stopped fading.'
  - 'That is how it is done. Clean, and nothing broken on the way.'
  - 'Fixed. lionX will not like that. I like it very much.'
  - 'Done, and done well. You are getting the feel of the Lexicon.'
  - 'Mended. A lamp somewhere just burned a little brighter.'
  - 'Well cast. You did not even hesitate.'
  - 'Good. One more stitch in the Archive.'
  - 'That will hold. The stone likes being put right.'
  - 'Done. If the Archive could purr, it would. Well. A different purr.'
  - 'Lovely. Tidy, but not lionX tidy. The good kind.'
  - 'Mended. I would applaud, but I am a quill.'
  - 'Good. The halls feel less crooked already.'
  - 'That is the Archive mended, one small piece at a time. Which is the only way it ever was.'
  - 'Nicely done. I will write that one down. In my head. I have a very good head.'
  - 'Fixed. You are starting to sound fluent.'
  - 'Mended. The books on that shelf are whispering about you. Kindly.'
  - 'Good. Steady hands, steady spells.'
  - 'Done. Even the dust looks pleased.'
  - 'There. The Lexicon hums when you get it right. Did you hear it?'
noDuty: 'Nothing needs mending right now. Wander, read, practice as you like.'
idle: 'Nothing needs mending here right now. Wander as you like, or cast `duty` for work.'
gateSealed: 'The way forward is still sealed. Keep practicing.'
gateOpen: 'Something stirs at the far end of the hall. The way forward is open.'
resume: 'Back again. The candle held while you were away. Here is where we were.'
galleryNew: 'I hung that in your cell, by the way. Everything you mend leaves something behind. `ls ~/gallery` to see your collection. Once you learn to read pages, you can look at any of them again.'
wrongPlace: 'Right name, wrong place. You are in {here}. The one I mean is {there}.'
solutionIntro: 'Here is one way to do it. Each piece, and what it does:'
dutySkipped: 'Set that one aside. Mishaps happen; the Archive has more work. Here is a fresh one.'
noSkip: 'There is no duty to set aside right now.'
skipReminder: 'If something went wrong and this one cannot be finished any more, `duty reset` puts back what went missing, or `duty skip` sets it aside for a fresh one.'
untilTrial: 'Next trial: about {n} more dut{s}, done without hints. Each one moves the story on.'
untilTrialEasy: 'Next trial: about {n} more dut{s}. Hints are fine. Each one moves the story on.'
resetDone: 'I found what went missing and put it back where it started: {files}. Try again. Make the rooms first this time.'
resetNothing: 'Nothing has gone missing. Everything you need is still somewhere in the Archive.'
resetReminder: 'If a page was lost or overwritten, `duty reset` puts the originals back where they started.'
storyOnward: 'This wing is mended. The story goes on from here:'
storyDone: 'The story is told, and the Archive is yours. Cast `duty` for work, or wander and read.'
tipFlag:
  - 'A thought, while it is fresh: `{spell} {flag}` {says}.'
  - 'Next time, try `{spell} {flag}`: it {says}.'
  - 'Since you are getting good with `{spell}`: `{flag}` {says}.'
  - 'One more trick for `{spell}`: `{flag}`, which {says}.'
  - 'Worth knowing: `{spell} {flag}` {says}. The Grimoire has more: `man {spell}`.'
tipSpell:
  - 'Remember, `{spell}` {says}. You will lean on it more than you think.'
  - '`{spell}` again. It {says}. Simple spells hold up the whole Archive.'
  - 'That was `{spell}` doing the work: it {says}.'
