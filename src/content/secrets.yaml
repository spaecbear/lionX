# Hidden notes around the Archive. Each is a dotfile, placed when its wing
# begins, and unlocks one cosmetic when read: a terminal color (theme) or a
# song for the soundtrack. Nothing here changes how the game plays.
secrets:
  - id: pressed-rose
    art: pressed-rose
    wing: apprentice-cells
    file: /archive/echo-hall/whisper-gallery/.a-pressed-rose
    theme: rose
    text: "A rose, pressed flat between two pages long ago. It still remembers its color.\n"
    say: "The rose colors the Lexicon's glass. A new look: `settings theme rose`."
  - id: rain-on-the-window
    art: rain-window
    wing: apprentice-cells
    file: /home/apprentice/.rain-on-the-window
    song: rain
    text: "Someone scratched a tune into the windowsill. When it rains, the drops play it.\n"
    say: 'A tune you can hum now. A new song: `settings song rain`.'
  - id: ember-bookmark
    art: ember-glass
    wing: reading-room
    file: /archive/reading-room/stacks/.ember-bookmark
    theme: ember
    text: "A bookmark of red glass. Hold it to the lantern and the whole room glows like coals.\n"
    say: 'The Lexicon glows like coals for a moment. A new look: `settings theme ember`.'
  - id: music-box
    guided: true
    art: music-box
    wing: reading-room
    file: /archive/reading-room/.a-music-box
    song: tavern
    text: "A music box, no bigger than an inkpot. Wind it and it plays a tavern song from the town below.\n"
    say: 'Your first secret. The music box keeps playing in your head: `settings song tavern` to hear it. Thirteen more are hidden in dot files around the Archive, each holding a new color or song. `status` keeps count.'
  - id: ink-stain
    art: ink-bottle
    wing: bindery
    file: /archive/bindery/presses/.ink-stain
    theme: ink
    text: "A stain of violet ink, older than the press. It spreads when no one is looking.\n"
    say: 'Violet ink seeps into the glass. A new look: `settings theme ink`.'
  - id: moon-dust
    art: moon-dust
    wing: observatory
    file: /archive/observatory/.moon-dust
    theme: moonlight
    text: "A pinch of silver dust, swept off the lens. It is cold, and faintly bright.\n"
    say: 'Moonlight settles on the Lexicon. A new look: `settings theme moonlight`.'
  - id: night-song
    art: night-song
    wing: observatory
    file: /archive/observatory/telescope/.a-night-song
    song: midnight
    text: "The keepers sang this to stay awake through the long watches. The notes are written as stars.\n"
    say: "The keepers' song is yours now. A new song: `settings song midnight`."
  - id: harbor-shell
    art: harbor-shell
    wing: aqueducts
    file: /archive/aqueducts/.harbor-shell
    song: harbor
    text: "A sea shell, far from any sea. Hold it close and you hear a harbor at dusk.\n"
    say: 'The harbor hums in the pipes. A new song: `settings song harbor`.'
  - id: frost-on-the-lock
    art: frost-lock
    wing: vault
    file: /archive/vault/ledgers/.frost-on-the-lock
    theme: frost
    text: "Frost grows on this lock in summer. The Archivist never found out why.\n"
    say: 'Frost creeps across the glass. A new look: `settings theme frost`.'
  - id: moss-lantern
    art: moss-lantern
    wing: haunted-stacks
    file: /archive/haunted-stacks/.moss-lantern
    theme: moss
    text: "A lantern grown over with moss. Something friendly lives inside and glows green.\n"
    say: 'A soft green glow follows you. A new look: `settings theme moss`.'
  - id: snow-in-the-cracks
    art: snowfall
    wing: undercroft
    file: /archive/undercroft/.snow-in-the-cracks
    song: snowfall
    text: "Snow drifts down through a crack in the stone, from a sky nobody has seen in years.\n"
    say: 'Quiet, like snow. A new song: `settings song snowfall`.'
  - id: first-light
    art: first-light
    wing: root
    file: /archive/root/.first-light
    song: sunrise
    text: "The first light that ever touched the Archive, kept in a jar. It hums when it is opened.\n"
    say: 'The jar hums a morning song. A new song: `settings song sunrise`.'
  - id: a-single-gray-hair
    wing: observatory
    file: /archive/observatory/telescope/eyepiece/drawer/.a-single-gray-hair
    theme: grigio
    art: gray-hair
    text: "A single gray hair, caught in the drawer of the great lens.\n\nThe keepers' notes mention a visitor, long ago, who stood at the eyepiece all night and never seemed to grow tired. Gray eyes. A stillness about him, as if time went around him instead of through him. The keepers called him L'Osservatore: the one who watches time pass.\n\nNobody saw him leave. Nobody is sure he ever did.\n"
    say: 'For a moment the whole world turns gray, and very still. Then it moves again. A new look: `settings theme grigio`.'
  - id: a-black-feather
    wing: haunted-stacks
    file: /archive/haunted-stacks/workroom/.a-black-feather
    song: crow
    art: feather
    text: "A black feather, glossy and light. When you pick it up, somewhere far off, a crow calls once.\n\n    caw.\n"
    say: 'Somewhere in the stacks, a crow calls once, and is quiet. A new song: `settings song crow`.'
