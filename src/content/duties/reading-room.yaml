# Duties for the Reading Room. Placed under /archive/reading-room/carrels.
# Duties about one particular spell (less, head, tail, man, --help) ask for that
# spell in their goal, so practice strengthens it; others accept any way to read.
templates:
  - id: misplaced-book
    art: [book, book-closed]
    spells: [cd, ls, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      book:
        {
          pick:
            [moth-census, bell-psalms, salt-and-its-uses, rain-almanac, notes-on-ink, tide-tables],
        }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/{book}': "The {book}, restored. Its ink holds steady again.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'The {book} turned up in one of the reading carrels, /archive/reading-room/carrels/{carrel}. Read it so it remembers its words.'
    hints:
      - 'Go to the carrel, look, then read.'
      - '`cd` to the carrel, `ls`, then `cat` the book.'
      - 'Type: cat /archive/reading-room/carrels/{carrel}/{book}'
    goal: { read: '/archive/reading-room/carrels/{carrel}/{book}' }
    solution: ['cd /archive/reading-room/carrels/{carrel}', 'ls', 'cat {book}']

  - id: last-entry
    art: [quill]
    spells: [tail]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      room: { pick: [map-room, bell-loft, ink-closet, copy-hall, owl-roost] }
      watcher:
        variants:
          - keeper_on_watch: 'tobin'
            diary: "Entry 1: Tobin on watch. All quiet in the {room}. Brought bread. Do not tell the ledger.\nEntry 2: quiet. A moth tried the lantern and thought better of it.\nEntry 3: quiet. Mira came by for a pencil and stayed an hour arguing about moths.\nEntry 4: nothing to report. The clock in the {room} is four minutes slow again.\nEntry 5: all quiet. Rain on the high windows.\nEntry 6: quiet. Someone left a cup of tea on the sill. Still warm. Nobody claims it.\nEntry 7: all quiet in the {room}. Ate the bread.\nEntry 8: nothing. Mira says the shelves feel heavier at night. Told her to sleep.\nEntry 9: all quiet. Dusted the third shelf. Found a button.\nEntry 10: quiet. The button is not mine. It is not Mira's either.\nEntry 11: all quiet in the {room}.\nEntry 12: nothing to report. Wind in the chimney, low and steady.\nEntry 13: quiet. Counted the books twice. Same number both times. Good.\nEntry 14: all quiet. A page turned by itself on the reading stand. Draft, probably.\nEntry 15: nothing. Draft, definitely.\nEntry 16: all quiet in the {room}. Brought more bread.\nEntry 17: quiet. Mended the spine of a hymnal. It hums when you close it now.\nEntry 18: all quiet. The tea cup is gone from the sill.\nEntry 19: nothing to report. I did not move the tea cup.\nEntry 20: quiet. Snow on the roof. The {room} smells of candle wax and cold stone.\nEntry 21: all quiet in the {room}.\nEntry 22: nothing. Mira found the button's twin, under the door.\nEntry 23: all quiet. Two buttons now, side by side on my desk.\nEntry 24: quiet. The Archivist walked through without speaking. Looked tired.\nEntry 25: all quiet in the {room}.\nEntry 26: nothing to report. The lamps are burning lower than they should.\nEntry 27: quiet. Trimmed every wick. They burn low anyway.\nEntry 28: all quiet. Too quiet. I keep listening for something.\nEntry 29: nothing. Heard purring in the walls. Told no one.\n"
          - keeper_on_watch: 'maud'
            diary: "Entry 1: Maud, night porter, taking the watch. I have done this for fifty years and I have never once slept.\nEntry 2: Rounds done. The {room} locked, then unlocked, because someone was still in it.\nEntry 3: It was an apprentice, asleep on the atlas. Covered them with my coat.\nEntry 4: Coat returned, folded, with a thank-you note. Kept the note.\nEntry 5: Rounds done. An owl in the {room}. We regarded each other. It left first.\nEntry 6: A cold night. Lit the stove. Somebody had already left kindling by it. Bless whoever.\nEntry 7: Rounds done. Nothing stirring but the clocks.\nEntry 8: Rounds done. A book on the floor that was on the shelf an hour ago. Put it back.\nEntry 9: Same book on the floor. Put it back again, with a firm word.\nEntry 10: Book stayed. Firm words work on books. Remember that.\nEntry 11: Rounds done. Found Tobin eating in the reading room. Said nothing. Took a biscuit as a fee.\nEntry 12: A clear night. Stars over the {room} skylight. Stopped to look. Allowed.\nEntry 13: Rounds done. The cat flap swung, though we have no cat.\nEntry 14: Left out a saucer of milk, in case we have a cat after all.\nEntry 15: Saucer empty in the morning. We have a cat, or something like one.\nEntry 16: Rounds done. Every lamp lit, every door where it should be.\nEntry 17: A visitor asked the way to the root at midnight. I did not like the look of them. Sent them back.\nEntry 18: Rounds done. Hummed while I walked. The halls hummed back. Old buildings do that.\nEntry 19: Rounds done. A lamp out in the east hall. Relit it. Out again by the next round.\nEntry 20: Relit it again. Stayed with it until dawn. It held.\nEntry 21: Rounds done. Quiet. My knees are older than this building, some nights.\nEntry 22: The Archivist brought me tea at three in the morning. First time in fifty years.\nEntry 23: They asked if I had noticed anything strange. I said, define strange.\nEntry 24: They laughed. Then they did not. They asked me to keep the lamps lit, whatever happens.\nEntry 25: Rounds done. I will keep the lamps lit.\nEntry 26: Rounds done. Two lamps out. Relit both.\nEntry 27: Rounds done. Five lamps out. Relit four. The fifth would not take.\nEntry 28: Rounds done. The halls are not humming back tonight.\nEntry 29: Rounds done. Something in the walls is purring instead.\n"
          - keeper_on_watch: 'mira'
            diary: "Entry 1: Mira, watching for the first time. I do not see why Tobin complains. I have brought eleven books.\nEntry 2: Read one book. All quiet in the {room}.\nEntry 3: Read two books. A moth on the lamp. Wrote its markings down. Not a moth I know.\nEntry 4: Read three books. Looked up the moth. Not in any of them.\nEntry 5: Read a fourth book. The moth is still here. I think it is reading over my shoulder.\nEntry 6: All quiet. Named the moth Footnote.\nEntry 7: Read a fifth book, out loud, for Footnote. Footnote enjoyed chapter two.\nEntry 8: Quiet. Tobin came by and laughed at me. Footnote landed on his nose. Justice.\nEntry 9: Read a sixth book. The {room} feels heavier at night than in the day. I am sure of it.\nEntry 10: Weighed a shelf by lifting one end. It is heavier at night. I am right.\nEntry 11: All quiet. Told Tobin. He told me to sleep. I will not.\nEntry 12: Read a seventh book. In it, a pressed flower, very old. Put it back exactly where it was.\nEntry 13: Quiet. The clock is slow. Footnote sat on the minute hand. Perhaps that is why.\nEntry 14: Moved Footnote. The clock is still slow.\nEntry 15: Read an eighth book. It mentions an Eco. Who is Eco?\nEntry 16: Looked up Eco. Nothing in the {room}. Everything in the {room} is about Eco, if you squint.\nEntry 17: All quiet. Footnote has a friend now. Named it Endnote.\nEntry 18: Read a ninth book. Borrowed four more from the stacks. Will return them. Eventually.\nEntry 19: Quiet. The ledger at the reading desk says I have not returned anything. Ever. Fair.\nEntry 20: Read a tenth book. A note in the margin, in violet ink: 'keep reading'. I intend to.\nEntry 21: Nobody here uses violet ink.\nEntry 22: All quiet. Found the violet note's twin in an eleventh book. Same hand. Same words.\nEntry 23: Quiet. Asked Footnote about the violet ink. Footnote declined to comment.\nEntry 24: Read a twelfth book. The lamps are low. I am reading closer to the page.\nEntry 25: All quiet. Trimmed the wicks. The lamps stayed low. Moved closer to the page.\nEntry 26: Quiet. Footnote and Endnote are sitting on the lamp, very still, as if waiting.\nEntry 27: Read a thirteenth book by the last good lamp.\nEntry 28: Nothing to report, except: I have read more books tonight than in a month, and none were enough.\nEntry 29: Quiet. The moths have gone. I did not see them go. I hear purring.\n"
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/watch-log': "{diary}Entry 30: the {room} lamp went out at midnight. Something purred.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'The watch log in /archive/reading-room/carrels/{carrel} has thirty entries. Only the newest matters. Read the end of it with `tail`.'
    hints:
      - 'The newest entry is at the bottom.'
      - '`tail` reads the last lines. `-n 1` reads just one.'
      - 'Type: tail -n 1 /archive/reading-room/carrels/{carrel}/watch-log'
    goal: { all: [{ ran: tail }, { read: '/archive/reading-room/carrels/{carrel}/watch-log' }] }
    solution: ['tail -n 1 /archive/reading-room/carrels/{carrel}/watch-log']

  - id: ledger-heading
    art: [ledger]
    spells: [head]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      room: { pick: [map-room, bell-loft, ink-closet, copy-hall, owl-roost] }
      keeper: { pick: [Mira, Tobin, the-Archivist, a-night-porter] }
      ledgerkind:
        variants:
          - ledgerkind: 'rules'
            ledgerbody: "Rule one: no ink near the open books.\nRule two: no food. This means you, Tobin.\nRule three: return what you borrow, by the next new moon.\n\nBorrowed: A Field Guide to Dust. Returned, dustier.\nBorrowed: Lantern Keeping for Beginners. Returned.\nBorrowed: The Book of Small Hours. Not returned. Fine of one candle.\nBorrowed: Salt and Its Uses. Returned with a page folded. Unfolded it.\nBorrowed: Songs for Empty Halls. Returned. Smells of rain.\nBorrowed: Owls of the Upper Stacks. Returned by an owl.\nBorrowed: A History of Bells. Returned, ringing faintly.\nBorrowed: Maps of Places That Moved. Returned. The map has moved.\nBorrowed: The Grammar of Echoes. Returned twice. Only borrowed once.\n\nNote: the {room} needs new candles before winter.\nNote: something keeps rearranging the C shelf. Alphabetically, at least.\nNote: heard purring again. Checked under every desk. Nothing.\nNote: the ink in this ledger is fading faster than it should.\nNote: if you are reading this and I am not here, keep the ledger.\n\nSigned, {keeper}.\n"
          - ledgerkind: 'supplies'
            ledgerbody: "Supplies, counted every new moon.\n\nCandles, tallow: 40. Candles, wax, for best: 6. Candles, mysteriously half-eaten: 2.\nInk, lamp black: 3 jars. Ink, oak-gall: 1 jar, guard it. Ink, violet: 0. We do not stock violet.\nPaper, good: one ream. Paper, scrap: the whole bottom drawer.\nQuills: 12. Quills that talk: 1 (do not count it twice).\nGlue: enough. Thread for binding: never enough.\nString: a ball the size of a cat. The cat is unrelated.\nBiscuits: 0. See rule two. See Tobin.\n\nLent out: a ladder, to the Bindery. Returned with one rung missing.\nLent out: the good scissors, to the Observatory. Not returned. The good scissors are gone.\nReceived: a crate of lamp oil from the town. Short by a jar.\nReceived: a crate of apples from the garden. Over by three. Nobody complains.\n\nNotes: the oil is going faster than it should. The lamps burn low regardless.\nNotes: bought more oil. Still burns low. It is not the oil.\nNotes: put the question to the Archivist. They went pale and said 'I know'.\n\nCount closed, {keeper}.\n\n"
          - ledgerkind: 'letters'
            ledgerbody: "Letters received at the {room}, and what we did about them.\n\nFrom the town baker: may his daughter apprentice here? Yes. She is very good.\nFrom the baker's daughter, a year later: may her cat apprentice here? No.\nFrom the cat, apparently: a scratched page. Filed under 'appeals'.\nFrom a scholar abroad: do we hold a copy of The Grammar of Echoes? We do. She may not borrow it.\nFrom the same scholar: please? Still no. Come and read it here.\nFrom the same scholar, a month later: she came. She cried at chapter four. Everybody does.\nFrom the Observatory: our good scissors. They are returning them. (They did not.)\nFrom nobody: a letter in violet ink, unsigned, asking if anyone here has seen a gray-haired man.\nWe had not. We wrote back, but there was no address. The reply is still on the desk.\nFrom the Archivist: a note to all keepers. 'Keep the lamps lit. Whatever happens.'\nFrom Tobin: a note to all keepers. 'Who took my biscuits.' (Filed under 'not our problem'.)\nFrom the guardian, we think: a page that only says 'tidy' forty times.\nWe did not know the guardian could write. Filed it carefully. Did not reply.\n\nLetters unanswered: three. Letters unanswerable: one.\nLetters we wish we could send: to whoever is reading this, keep going.\n\nKept by {keeper}, who answers what can be answered.\n\n"
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/ledger': "Ledger of the {room}\nKept by {keeper}\nOpened in the year of quiet stacks\n{ledgerbody}"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'Who kept the ledger in /archive/reading-room/carrels/{carrel}? The keeper is named in its first few lines. Read only the top with `head`.'
    hints:
      - 'The name is near the start.'
      - '`head` reads the first lines; `-n 3` reads three.'
      - 'Type: head -n 3 /archive/reading-room/carrels/{carrel}/ledger'
    goal: { all: [{ ran: head }, { read: '/archive/reading-room/carrels/{carrel}/ledger' }] }
    solution: ['head -n 3 /archive/reading-room/carrels/{carrel}/ledger']

  - id: hidden-slip
    art: [envelope]
    spells: [ls, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      slip: { pick: [borrowing-slip, love-letter, overdue-notice, pressed-flower, margin-note] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/.{slip}': "A {slip}, tucked away where only the curious look.\n"
        '/archive/reading-room/carrels/{carrel}/empty-inkpot': "Dry.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'Something is tucked out of sight in /archive/reading-room/carrels/{carrel}. Find it and read it.'
    hints:
      - 'Hidden names begin with a dot.'
      - '`ls -a` shows them. `cat` reads them.'
      - 'Type: ls -a /archive/reading-room/carrels/{carrel}   then: cat /archive/reading-room/carrels/{carrel}/.{slip}'
    goal: { read: '/archive/reading-room/carrels/{carrel}/.{slip}' }
    solution:
      [
        'ls -a /archive/reading-room/carrels/{carrel}',
        'cat /archive/reading-room/carrels/{carrel}/.{slip}',
      ]

  - id: long-scroll
    art: [scroll]
    spells: [less]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      scroll:
        variants:
          - scroll: 'tides'
            scrolltext: "THE SCROLL OF TIDES\nkept by the harbor archivists, who wrote only when the water turned\n\nThe sea comes in twice a day and goes out twice a day.\nThe harbor archivists wrote down every tide for three hundred years.\nMost of this scroll is the record. Some of it is not.\n\nSpring, first year: high water at dawn. A good beginning.\nSpring, first year: low water at dusk. The boats sat on the mud like tired dogs.\nSummer: the highest tide anyone remembered. It reached the third step of the archive.\nWe moved the lowest shelf up one shelf. We have never moved it back.\nAutumn: a tide so low the old wall showed. Someone had carved a name in it.\nThe name was the same as mine. I do not know what to make of that.\nWinter: storm tide. We did not write. We bailed.\n\n(Here a stain, the shape of a wave.)\n\nYear forty: a girl asked why we write the tides down. The sea does not forget them.\nI told her the sea forgets everything. It only repeats.\nYear forty-one: the girl is an apprentice now. She writes neater than I do.\nYear sixty: she is the head archivist. I am writing this from the window seat.\nYear sixty-two: high water, low water, high water, low water.\nIt is a kind of breathing, if you write it down long enough.\n\nYear one hundred: the harbor silted up. The boats went elsewhere.\nThe tides did not care. We kept writing them down anyway.\nYear one hundred and four: a whale came into the harbor at high tide and stayed a week.\nNobody wrote the tides that week. We were all watching the whale.\nThe whale left on the last high water of the month. We went back to work.\n\nYear two hundred: there are no harbor archivists left but me.\nI bring the scroll to the Archive, where it will be kept dry.\nI am told the Archive does not forget. I hope that is a kinder thing than the sea.\n\nThe last entry, in a different hand, years later:\nChecked the old harbor today. High water at noon.\nSomeone still has to.\n"
          - scroll: 'moths'
            scrolltext: "THE SCROLL OF MOTHS\na census, taken by night, by the keepers of the upper stacks\n\nMoths are drawn to lamps, and the Archive is full of lamps.\nSo the keepers counted them, the way other people count sheep.\nEach line is a night. Each number is a moth.\n\nThe first night: three moths. One of them sat on the ledger and would not move.\nThe second night: five. The ledger moth was back. We named it Ledger.\nThe third night: four, and Ledger.\nThe tenth night: twenty-two. Someone left the high window open.\nThe eleventh night: the window is closed. Twenty-two moths are still inside.\n\n(Here a drawing of a moth, carefully done, with every spot counted.)\n\nThe keepers argued about whether to count moths that were already counted.\nThe rule became: a moth seen twice is a moth that likes it here. Count it twice.\nThis is why the totals are so high. Nobody minds.\n\nA great moth night, the summer of the long lamps: four hundred and six.\nThe keeper fell asleep at four hundred and two and was woken by the last four.\nThey landed on her book. She was very nearly sure it was a sign.\n\nA note in the margin: moths do not eat books. That is a different creature.\nA note under the note: then why is chapter nine missing.\nA note under that: chapter nine was always missing.\n\nWinter: no moths. The keepers counted the stars through the window instead.\nIt is not the same. Stars do not land on your hand.\n\nSpring: the first moth of the year, at the lamp by the door. Everyone came to see it.\nLedger's great-great-great-grandmoth, probably. The ledger is still here, at least.\n\nThe last night written: the lamps are going out early now, one by one.\nFewer moths every night. Not because they are gone.\nBecause there is less light to come to.\nSomebody relight the lamps. The moths are waiting.\n"
          - scroll: 'bells'
            scrolltext: "THE SCROLL OF BELLS\nthe ringers' book, with every bell in the Archive and the reason it rings\n\nThe Archive has forty-one bells. Each one means something.\nThis scroll is so that nobody rings the wrong one.\nRinging the wrong one has happened. Read the scroll.\n\nThe great bell, in the high tower: ring for a new keeper. Once only.\nThe small bell by the Reading Room door: ring when a book comes back.\n(It has not rung in some time. See the reading-desk ledger.)\nThe cracked bell in the cellar: do not ring. It knows what it did.\nThe bell in the bell-loft with the frayed rope: ring for supper.\nThe three hand bells on the landing: ring for fire, flood, and owls, in that order.\nThe bell in the Bindery: ring when a book is finished. It is very old and very quiet.\nThe bell nobody can find: it rings by itself, on the first night of winter.\n\n(Here a list of thirty-four more bells, each with its rope color and its reason.)\n\nA rule: if you hear a bell you do not know, write it down.\nBells you do not know are either new, or very old, or not bells.\n\nAn entry, years later: heard a bell I did not know, in the Haunted Stacks.\nWrote it down. Went to look. It was a spirit, ringing itself to stay awake.\nAsked it to stop. It apologized and rang more quietly.\n\nAn entry, later still: the great bell rang tonight, once.\nThere is no new keeper. Nobody pulled the rope.\nI have checked the rope three times. It is still swinging.\n\nThe last entry: the bells have gone quiet all over the Archive.\nEven the one nobody can find. Even the cracked one, which is a relief.\nWhen they start again, it will mean something is mended.\nListen for them.\n"
          - scroll: 'salt'
            scrolltext: "THE SCROLL OF SALT\na book of preserving, in the Archive kitchen's own hand\n\nSalt keeps things. Fish, meat, lemons, and, if you are careful, memories.\nThis scroll is about the first three. The fourth is not the kitchen's business.\n\nTo keep fish: split it, wash it in cold water, and bury it in salt for a week.\nTo keep lemons: cut them in a cross, pack them with salt, and forget them for a month.\nDo not actually forget them. The last cook did. We found them a year later. They were excellent.\nTo keep bread from going stale: you cannot. Eat it.\n\n(Here a grease mark, and the words SORRY ABOUT THE GREASE.)\n\nA recipe for the soup the Archivist likes, which uses all the salt you have and more:\nOnions, barley, whatever the garden gave, and a long afternoon.\nTaste it. Add salt. Taste it. Add salt. Stop before you cry.\nThe Archivist says this is the only soup that tastes like being home.\n\nA note from an apprentice: why is there a cooking scroll in the Archive?\nA note from the cook, underneath: because the Archive keeps everything, child.\nIncluding what we ate, and who we cooked for, and how they liked it.\n\nA list of who liked their soup how:\nTobin: too much salt. Mira: no salt, and says so every time.\nThe night porter: any soup, at any hour, gratefully.\nThe Archivist: as written above. Always as written above.\nThe little spirit that lives behind the oven: one crumb, set out on the hearth.\n\nThe last entry: the kitchen fire went out tonight and would not relight.\nFirst time in four hundred years.\nI have salted everything I can. It will keep until someone comes back.\nWhoever you are, there are lemons in the cellar. They will be excellent by now.\n"
          - scroll: 'rain'
            scrolltext: "THE SCROLL OF RAIN\nin which the window keepers wrote down every rain, and what it sounded like\n\nThe Reading Room has eleven great windows, and somebody has to watch them.\nWhen it rained, the window keepers wrote down the rain.\nNot how much. How it sounded.\n\nA soft rain, like someone turning pages in the next room.\nA hard rain, like applause for something we did not see.\nA rain that started and stopped all afternoon, as if it could not make up its mind.\nA rain with thunder in it. The books on the north shelf were nervous.\nA fine rain, more mist than rain. Wrote this line very lightly.\n\n(Here a page left to dry, and the ink run into soft blue clouds.)\n\nSummer: no rain for forty days. We wrote down the silence instead.\nIt sounded like waiting.\nThe forty-first day: rain. Everyone went out into it. Even the Archivist.\nEspecially the Archivist, who stood in the courtyard with their face turned up,\nand did not come in until their sleeves were heavy.\n\nAutumn: rain on the copper roof, which sounds like coins.\nAutumn: rain on the slate roof, which sounds like a long sigh.\nAutumn: rain on the glass roof of the Observatory, which sounds like nothing at all,\nbecause the Observatory people complain that it is loud, and close the shutters.\n\nWinter: rain that froze as it fell. It ticked against the windows like a clock.\n\nA note in the margin: why write down rain? It always comes back.\nA note under it: not this rain. This rain only comes once.\n\nThe last entry: rain tonight, and it sounded like something purring.\nProbably it was only rain.\nI closed the windows anyway.\n"
          - scroll: 'ink'
            scrolltext: "THE SCROLL OF INK\nthe inkmakers' book: every color the Archive ever wrote with, and how to make it\n\nAll the words in the Archive are written in something.\nThe inkmakers kept this scroll so the something would never run out.\n\nOak-gall black: crushed oak galls, rainwater, iron, and patience. It darkens as it dries.\nIt darkens for years, actually. The oldest pages are darker than the night they were written.\nLamp black: soot from the Lantern Hall, gum, and water. Cheap, honest, and everywhere.\nWalnut brown: for letters you do not want anyone to take too seriously.\nMadder red: for corrections, warnings, and the Archivist's signature.\n\n(Here a column of small colored squares, each with its name beside it.)\n\nBlue: very rare. Ground from a stone that only one trader would sell.\nThe trader stopped coming. There is one jar left. Do not open it for anything ordinary.\nGreen: from a moss in the Haunted Stacks. It glows a little, which is either a feature or a warning.\nGold: from gold. Only for the first letter of a book. Only if the book deserves it.\nViolet: we never made violet. Nobody knows who leaves the violet notes.\n\nA rule: test every new ink on the back of this scroll. Hence the stains.\nA second rule: do not test ink on the apprentices.\n(This rule has a story. It is not written here.)\n\nA note: the ink in the oldest books is fading. Not the oak-gall. Everything else.\nFading faster than ink should fade. As if something is taking the words back.\nWe are copying what we can.\n\nThe last entry, in plain lamp black:\nOut of everything but lamp black. Writing with that.\nWords are words, whatever color they are.\n"
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/scroll-of-{scroll}': '{scrolltext}'
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'The scroll of {scroll} in /archive/reading-room/carrels/{carrel} is too long to read in one gulp. Page through it with `less`.'
    hints:
      - 'Use the spell that shows one page at a time. Remember `q` to close it.'
      - "`less` and the scroll's path."
      - 'Type: less /archive/reading-room/carrels/{carrel}/scroll-of-{scroll}'
    goal:
      {
        all: [{ ran: less }, { read: '/archive/reading-room/carrels/{carrel}/scroll-of-{scroll}' }],
      }
    solution: ['less /archive/reading-room/carrels/{carrel}/scroll-of-{scroll}']

  - id: biggest-book
    art: [tomes]
    spells: [ls, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      room: { pick: [map-room, bell-loft, ink-closet, copy-hall, owl-roost] }
      big:
        variants:
          - big: 'atlas'
            bigtext: "An atlas of the {room}, and of the halls around it, drawn to the best of our knowledge.\nPlate 1: the {room} from above. Three doors, two windows, one cat flap (purpose unknown).\nPlate 2: the corridor outside, which is longer going east than coming back west.\nPlate 3: the stair down. Count the steps. The number changes.\nPlate 4: the stair down, counted again. It is still changing.\nPlate 5: the cellar, marked HERE BE OWLS in the old style.\nPlate 6: the cellar again, with the owls crossed out and BATS written in.\nPlate 7: a room that is not on any other map. Labeled only 'later'.\nPlate 8: the roof, with every chimney numbered. Chimney 9 is not a chimney.\nPlate 9: chimney 9, from below. It is a telescope. Nobody remembers putting it there.\nPlate 10: the garden. Herbs on the left, roses on the right, a sundial that is always wrong.\nPlate 11: the sundial, corrected. Now it is wrong in the other direction.\nPlate 12: the well. Very deep. Somebody dropped a map down it, which is why plate 13 is damp.\nPlate 13: damp.\nPlate 14: the route to the Reading Room, the long way, past the window with the best light.\nPlate 15: the route to the Reading Room, the short way, through a cupboard.\nPlate 16: the cupboard, in detail. Mind the brooms.\nPlate 17: a hall that moved in the night. Old position dotted, new position solid.\nPlate 18: the same hall, moved back. Someone has added an arrow and the word WHY.\nPlate 19: the whole wing, folded small, for carrying in a pocket.\nPlate 20: the edges of the map, where the mapmakers stopped walking.\nPlate 21: beyond the edges, drawn from what other people said. Less reliable.\nPlate 22: much less reliable. There is a sea here. There is no sea here.\nPlate 23: a correction slip pasted over the sea.\nPlate 24: the {room} at night, every lamp marked with a small star.\nPlate 25: the same, years later. Fewer stars.\nPlate 26: the same, last winter. Fewer still.\nPlate 27: a blank page, with a compass rose in the corner and nothing else.\nPlate 28: the mapmaker's note: the Archive grows faster than we can draw it.\nPlate 29: a last map, in a shaky hand, of the way from the {room} to the root.\nPlate 30: the key. Black is stone, blue is water, gold is lamplight, violet is not ours.\n"
          - big: 'compendium'
            bigtext: "A compendium of useful things about the {room}, collected by many hands, in no order at all.\nItem: the third floorboard from the door creaks. Step on the fourth.\nItem: the window latch sticks in wet weather. Lift, then push.\nItem: the best reading chair is the green one. The green one is always taken.\nItem: a remedy for ink on the fingers: lemon juice, then patience.\nItem: a remedy for ink on the book: there is none. Be careful.\nItem: the number of steps from here to the kitchen is forty. At night it is forty-three.\nItem: owls in the rafters are lucky. Owls in the inkwell are not.\nItem: if a lamp gutters for no reason, there is a reason. Check the guardian.\nItem: the old clock in the corner runs fast when it is happy.\nItem: nobody knows what makes the clock happy.\nItem: a list of words the Lexicon does not like: please, sorry, and 'just'.\nItem: a list of words the Lexicon does like: almost all of them, if spelled right.\nItem: how to fold a letter so it opens into a little paper lantern.\nItem: how to fold it back, which is much harder.\nItem: the dust in the {room} is mostly paper, with a little stardust and some cat.\nItem: which cat is not recorded.\nItem: a riddle left by an apprentice: what has pages but is not a book? (A calendar.)\nItem: a better riddle left underneath: what has a book but no pages? (The Archive, someday.)\nItem: do not leave tea on the windowsill. Something drinks it.\nItem: do leave a crumb on the hearth. Something eats it and is grateful.\nItem: the {room} was once painted blue. You can see it under the chipped corner.\nItem: under the blue is green. Under the green is a drawing of a lion's head.\nItem: we painted over the lion again.\nItem: a tally of books mended in this room: too many to count, and every one worth it.\nItem: a tally of books lost: eleven. Their names are written on the back page.\nItem: the names on the back page are fading.\nItem: we wrote them again on the front page.\nItem: for whoever keeps this compendium next: add something useful.\nItem: (in a new hand) the fourth floorboard creaks now too. Step on the fifth.\n"
          - big: 'chronicle'
            bigtext: "A chronicle of the {room}: what happened here, year by year, as plainly as we could tell it.\nYear 1: the {room} was opened. One shelf, one lamp, one keeper who would not give her name.\nYear 2: a second shelf. The keeper gave her name. It was Hesper. She regretted it.\nYear 5: bees on the roof. Honey on everything. Hesper delighted.\nYear 9: the bees left. Hesper not delighted. The honey stains remain.\nYear 14: the first flood. Saved the fourth shelf. Dried the rest over a summer.\nYear 15: the dried books make a crinkling sound when opened. Called them singing books.\nYear 30: Hesper retired to the roof, where she kept looking for her bees.\nYear 31: a new keeper. He read every book in the {room} in one winter, then left.\nYear 32: he came back. He said the world outside was smaller than he remembered.\nYear 60: the cold years. The {room} was closed and its books carried to safety.\nYear 68: the cold broke. The books came home. Three were missing.\nYear 69: searched for the three. Found mice, a hat, and a very old sandwich.\nYear 120: one of the three turned up inside a teapot. The other two are still out there.\nYear 150: the Lexicon's glow first reached the {room}. The keepers wept, a little.\nYear 151: they said it felt like being remembered.\nYear 200: a visiting scholar called the {room} the quietest place in any world.\nYear 201: asked which worlds she meant, she smiled and changed the subject.\nYear 260: the guardian was seen here for the first time, curled on a warm stack.\nYear 261: it purred while the keepers worked. They left a cushion out for it.\nYear 300: the guardian had grown too big for the cushion. They left a rug.\nYear 340: the guardian had grown too big for the room. It slept in the walls.\nYear 341: books began to drift back to their shelves by themselves. Nobody minded at first.\nYear 350: books would not leave their shelves at all. Readers began to mind.\nYear 352: the Archivist came to the {room} and spoke to the walls for a long time.\nYear 353: the books moved again. The walls were quiet.\nYear 410: the walls are not quiet any more.\nYear 411: the lamps burn low. The guardian does not sleep.\nYear 412: the Archivist has gone below. We are told not to follow.\nYear 412, later: somebody has to write the next year. Let it be a good one.\n"
          - big: 'register'
            bigtext: "The register of the {room}: everyone who ever worked here, and what they were known for.\nHesper: founder. Kept bees. Lost the bees. Kept the register anyway.\nCorran: kept silence so well that this entry was written by someone else.\nIlse: kept everything. Every scrap, every receipt. This register is one of her scraps.\nTamsin the Elder: mended the great flood books. Hated the word 'crinkling'.\nTamsin the Younger: called them singing books, to annoy Tamsin the Elder. It worked.\nBrother Ash: catalogued the owls. The owls catalogued him back.\nWren: could find any book by the smell of its paper. Could not find her own keys.\nFennick: dropped a candle once. Spent the rest of his life making sure nobody else did.\nDorrit: wrote the compendium. Wrote the riddles in it. Laughed at her own riddles.\nMaud: night porter for fifty years. Never once fell asleep. Claimed this, anyway.\nPell: taught three hundred apprentices to read. Taught one owl, by accident.\nOrrin: the only keeper to be bitten by a book. Would not say which.\nSelby: painted the {room} blue. Then green. Then gave up on paint entirely.\nHollis: grew roses in the garden. The roses outlived Hollis by a century.\nQuill (familiar, not keeper): advised everyone. Was thanked by some.\nJuno: brought the first star charts down from the Observatory to keep them dry.\nAbel: mapped the {room}. The map was wrong. Abel insisted the room was wrong.\nTeodor: kept the clocks. Every clock in the {room} still runs a little fast, in his memory.\nSabine: first to see the guardian. Gave it a cushion. Got a purr in return.\nLark: last to see the guardian small. Said it looked worried.\nWynn: wrote 'something is wrong with the walls' on the back of a receipt. Filed it here.\nMira: reads everything. Borrows everything. Returns, so far, nothing.\nTobin: does the night watch. Also eats in the reading room. Rule two is about him.\nOriel Vane: the Archivist. No further entry, at their own request.\n(Here a line scratched out so hard the pen went through the page.)\n(Here a line in violet ink, which no keeper ever used: 'And a visitor, who will not sign.')\nAn apprentice: the newest name. Still being written.\nA note at the foot of the register: everyone who works here is remembered here.\nA note under that: that is the whole point of an archive.\n"
      small: { pick: [pamphlet, leaflet, notecard] }
      middle: { pick: [tract, primer, digest] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/{big}': '{bigtext}'
        '/archive/reading-room/carrels/{carrel}/{small}': "A few words.\n"
        '/archive/reading-room/carrels/{carrel}/{middle}': "A few more words than that.\nBut not many.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'Three books in /archive/reading-room/carrels/{carrel}, and the biggest is fading fastest. Find which is biggest and read it.'
    hints:
      - "The long listing shows each book's size."
      - '`ls -l` shows sizes in bytes, just before the date. Then read the biggest.'
      - 'Type: ls -l /archive/reading-room/carrels/{carrel}   then: cat /archive/reading-room/carrels/{carrel}/{big}'
    goal: { read: '/archive/reading-room/carrels/{carrel}/{big}' }
    solution:
      [
        'ls -l /archive/reading-room/carrels/{carrel}',
        'cat /archive/reading-room/carrels/{carrel}/{big}',
      ]

  - id: grimoire-page
    art: [grimoire]
    spells: [man]
    params:
      spell: { pick: [ls, cd, pwd, cat, head, tail, less] }
    brief: 'The Lexicon has forgotten what `{spell}` is for. Open its page in the Grimoire to remind it.'
    hints:
      - 'The Grimoire has a page for every spell.'
      - "`man` and the spell's name. `q` closes the page."
      - 'Type: man {spell}'
    goal: { ran: { command: man, args: ['{spell}'] } }
    solution: ['man {spell}']

  - id: two-halves
    art: [letter]
    spells: [cd, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      sender: { pick: [Mira, Tobin, the-cook, a-copyist] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/letter-first-half': "Dear Archivist, the lamps on my floor\n"
        '/archive/reading-room/carrels/{carrel}/letter-second-half': "keep going out. Please come quickly. {sender}\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'A letter from {sender} was torn in two. Both halves are in /archive/reading-room/carrels/{carrel}. Read them together.'
    hints:
      - 'One spell can read both halves, one after the other.'
      - '`cat` takes more than one name.'
      - 'Type: cd /archive/reading-room/carrels/{carrel}   then: cat letter-first-half letter-second-half'
    goal:
      all:
        - { read: '/archive/reading-room/carrels/{carrel}/letter-first-half' }
        - { read: '/archive/reading-room/carrels/{carrel}/letter-second-half' }
    solution:
      ['cd /archive/reading-room/carrels/{carrel}', 'cat letter-first-half letter-second-half']

  - id: help-reminder
    art: [candle, candle-pair]
    spells: [cat, head, tail, ls]
    params:
      spell: { pick: [cat, head, tail, ls] }
    brief: 'Quick: the Lexicon wants a reminder of the flags `{spell}` takes. Ask the spell itself for help.'
    hints:
      - 'Most spells answer a particular flag with a short summary.'
      - "Add `--help` after the spell's name."
      - 'Type: {spell} --help'
    goal: { ran: { command: '{spell}', args: [--help] } }
    solution: ['{spell} --help']
