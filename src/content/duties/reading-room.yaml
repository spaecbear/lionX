# Duties for the Reading Room. Placed under /archive/reading-room/carrels.
# Duties about one particular spell (less, head, tail, man, --help) ask for that
# spell in their goal, so practice strengthens it; others accept any way to read.
templates:
  - id: misplaced-book
    art: [book, book-closed]
    spells: [cd, ls, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      book:
        {
          pick:
            [moth-census, bell-psalms, salt-and-its-uses, rain-almanac, notes-on-ink, tide-tables],
        }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/{book}': "The {book}, restored. Its ink holds steady again.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'The {book} turned up in one of the reading carrels, /archive/reading-room/carrels/{carrel}. Read it so it remembers its words.'
    hints:
      - 'Go to the carrel, look, then read.'
      - '`cd` to the carrel, `ls`, then `cat` the book.'
      - 'Type: cat /archive/reading-room/carrels/{carrel}/{book}'
    goal: { read: '/archive/reading-room/carrels/{carrel}/{book}' }
    solution: ['cd /archive/reading-room/carrels/{carrel}', 'ls', 'cat {book}']

  - id: last-entry
    art: [quill]
    spells: [tail]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      room: { pick: [map-room, bell-loft, ink-closet, copy-hall, owl-roost] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/watch-log': "Entry 1: all quiet in the {room}.\nEntry 2: all quiet. A moth tried the lantern and thought better of it.\nEntry 3: quiet. Tobin came by for a pencil and stayed an hour.\nEntry 4: nothing to report. The clock in the {room} is four minutes slow again.\nEntry 5: all quiet. Rain on the high windows.\nEntry 6: quiet. Someone left a cup of tea on the sill. It is still warm. Nobody claims it.\nEntry 7: all quiet in the {room}.\nEntry 8: nothing. Mira says the shelves feel heavier at night. I told her to sleep.\nEntry 9: all quiet. Dusted the third shelf. Found a button.\nEntry 10: quiet. The button is not mine. It is not Tobin's either.\nEntry 11: all quiet in the {room}.\nEntry 12: nothing to report. Wind in the chimney, low and steady.\nEntry 13: quiet. Counted the books twice. Same number both times. Good.\nEntry 14: all quiet. A page turned by itself on the reading stand. Draft, probably.\nEntry 15: nothing. Draft, definitely.\nEntry 16: all quiet in the {room}.\nEntry 17: quiet. Mended the spine of a hymnal. It hums when you close it now.\nEntry 18: all quiet. The tea cup is gone from the sill.\nEntry 19: nothing to report. I did not move the tea cup.\nEntry 20: quiet. Snow on the roof. The {room} smells of candle wax and cold stone.\nEntry 21: all quiet in the {room}.\nEntry 22: nothing. Mira found the button's twin, under the door.\nEntry 23: all quiet. Two buttons now, side by side on my desk.\nEntry 24: quiet. The Archivist walked through without speaking. Looked tired.\nEntry 25: all quiet in the {room}.\nEntry 26: nothing to report. The lamps are burning lower than they should.\nEntry 27: quiet. Trimmed every wick. They burn low anyway.\nEntry 28: all quiet. Too quiet. I keep listening for something.\nEntry 29: nothing. Heard purring in the walls. Told no one.\nEntry 30: the {room} lamp went out at midnight. Something purred.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'The watch log in /archive/reading-room/carrels/{carrel} has thirty entries. Only the newest matters. Read the end of it with `tail`.'
    hints:
      - 'The newest entry is at the bottom.'
      - '`tail` reads the last lines. `-n 1` reads just one.'
      - 'Type: tail -n 1 /archive/reading-room/carrels/{carrel}/watch-log'
    goal: { all: [{ ran: tail }, { read: '/archive/reading-room/carrels/{carrel}/watch-log' }] }
    solution: ['tail -n 1 /archive/reading-room/carrels/{carrel}/watch-log']

  - id: ledger-heading
    art: [ledger]
    spells: [head]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      room: { pick: [map-room, bell-loft, ink-closet, copy-hall, owl-roost] }
      keeper: { pick: [Mira, Tobin, the-Archivist, a-night-porter] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/ledger': "Ledger of the {room}\nKept by {keeper}\nOpened in the year of quiet stacks\nRule one: no ink near the open books.\nRule two: no food. This means you, Tobin.\nRule three: return what you borrow, by the next new moon.\n\nBorrowed: A Field Guide to Dust. Returned, dustier.\nBorrowed: Lantern Keeping for Beginners. Returned.\nBorrowed: The Book of Small Hours. Not returned. Fine of one candle.\nBorrowed: Salt and Its Uses. Returned with a page folded. Unfolded it.\nBorrowed: Songs for Empty Halls. Returned. Smells of rain.\nBorrowed: Owls of the Upper Stacks. Returned by an owl.\nBorrowed: A History of Bells. Returned, ringing faintly.\nBorrowed: Maps of Places That Moved. Returned. The map has moved.\nBorrowed: The Grammar of Echoes. Returned twice. Only borrowed once.\n\nNote: the {room} needs new candles before winter.\nNote: something keeps rearranging the C shelf. Alphabetically, at least.\nNote: heard purring again. Checked under every desk. Nothing.\nNote: the ink in this ledger is fading faster than it should.\nNote: if you are reading this and I am not here, keep the ledger.\n\nSigned, {keeper}.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'Who kept the ledger in /archive/reading-room/carrels/{carrel}? The keeper is named in its first few lines. Read only the top with `head`.'
    hints:
      - 'The name is near the start.'
      - '`head` reads the first lines; `-n 3` reads three.'
      - 'Type: head -n 3 /archive/reading-room/carrels/{carrel}/ledger'
    goal: { all: [{ ran: head }, { read: '/archive/reading-room/carrels/{carrel}/ledger' }] }
    solution: ['head -n 3 /archive/reading-room/carrels/{carrel}/ledger']

  - id: hidden-slip
    art: [envelope]
    spells: [ls, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      slip: { pick: [borrowing-slip, love-letter, overdue-notice, pressed-flower, margin-note] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/.{slip}': "A {slip}, tucked away where only the curious look.\n"
        '/archive/reading-room/carrels/{carrel}/empty-inkpot': "Dry.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'Something is tucked out of sight in /archive/reading-room/carrels/{carrel}. Find it and read it.'
    hints:
      - 'Hidden names begin with a dot.'
      - '`ls -a` shows them. `cat` reads them.'
      - 'Type: ls -a /archive/reading-room/carrels/{carrel}   then: cat /archive/reading-room/carrels/{carrel}/.{slip}'
    goal: { read: '/archive/reading-room/carrels/{carrel}/.{slip}' }
    solution:
      [
        'ls -a /archive/reading-room/carrels/{carrel}',
        'cat /archive/reading-room/carrels/{carrel}/.{slip}',
      ]

  - id: long-scroll
    art: [scroll]
    spells: [less]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      scroll: { pick: [tides, moths, bells, salt, rain, ink] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/scroll-of-{scroll}': "The scroll of {scroll}, as copied by a sleepy apprentice.\n\nIn the beginning there was {scroll}, and nobody had written it down.\nSo the first archivists went out to listen for it.\nThey listened at windows and at cellar doors.\nThey listened in the market and in the empty hours after it.\nThey listened until their ears ached and their candles were stubs.\nAnd at last, one of them heard it: {scroll}, faint and far away.\nShe wrote one word. Then another.\nBy morning she had a line, and by winter a page.\nThe others laughed at her, and then they asked to read it.\n\nThe scroll grew longer every year.\nIt grew so long that it no longer fit on its shelf.\nIt grew so long that it was rolled around a spindle of oak.\nThen around two spindles. Then around a cart.\nReaders would start at the beginning and grow old before the middle.\nA rule was made: no one may read the whole scroll in one sitting.\nA second rule was made: no one may read it in one gulp, either.\n(This is why you have `less`.)\n\nHere the hand changes. The new copyist writes smaller.\nShe says the scroll of {scroll} is not a story but a list.\nA list of every time someone noticed {scroll} and stopped to look.\nA child in a doorway. A sailor on a night watch.\nA baker who burned the bread because she was watching.\nAn old man who said it reminded him of someone.\nA cat. The copyist insists on the cat.\nEach one got a line. Each line is still here.\n\nHere the hand changes again. Shaky, hurried.\nThe copyist says the lamps are going out in the far halls.\nShe says the ink on the older lines is fading.\nShe says she is copying faster than she can read.\nShe says she can hear something purring in the stacks.\nShe says if the scroll ends here, someone must keep going.\n\nThe next line is blank.\n\nSo is the next.\n\nAnd then, in a different hand entirely, neat and patient:\nStill here. Still listening. Still writing it down.\nThe scroll of {scroll} is not finished, and it never will be.\nThat is the point of it.\nWhoever you are, reading this far: thank you.\nAdd a line when you are ready.\nEvery line is somebody noticing.\n\n(Here a gap, where a page was torn away.)\n\nLine, in a child's handwriting: I saw {scroll} today and it was nice.\nLine, in the Archivist's hand: So did I.\nLine, smudged: Me too.\nLine, very small: And me.\nLine, in violet ink: Everyone does, eventually.\n\nThe end of what has been written so far.\nLeave room for more.\n\n.\n.\n.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'The scroll of {scroll} in /archive/reading-room/carrels/{carrel} is too long to read in one gulp. Page through it with `less`.'
    hints:
      - 'Use the spell that shows one page at a time. Remember `q` to close it.'
      - "`less` and the scroll's path."
      - 'Type: less /archive/reading-room/carrels/{carrel}/scroll-of-{scroll}'
    goal:
      {
        all: [{ ran: less }, { read: '/archive/reading-room/carrels/{carrel}/scroll-of-{scroll}' }],
      }
    solution: ['less /archive/reading-room/carrels/{carrel}/scroll-of-{scroll}']

  - id: biggest-book
    art: [tomes]
    spells: [ls, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      room: { pick: [map-room, bell-loft, ink-closet, copy-hall, owl-roost] }
      big: { pick: [atlas, compendium, chronicle, register] }
      small: { pick: [pamphlet, leaflet, notecard] }
      middle: { pick: [tract, primer, digest] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/{big}': "Page 1: The {room} was built in a single night, according to the oldest account.\nPage 2: The second-oldest account says it took forty years. Both are signed by the same person.\nPage 3: Its first keeper was a woman named Hesper, who kept bees on the roof.\nPage 4: The bees are gone. The honey stains on the north wall are not.\nPage 5: Hesper's rule was simple: every book in the {room} must be read once a year.\nPage 6: When the {room} held twelve books, this was easy.\nPage 7: When it held twelve thousand, apprentices were hired.\nPage 8: The apprentices were paid in candles, bread, and the right to sleep in the warm room.\nPage 9: A great flood reached the third stair. The books on the fourth shelf were saved.\nPage 10: The books on the first three shelves were dried page by page over a summer.\nPage 11: Some of them still crinkle when you open them. Readers call them the singing books.\nPage 12: In the cold years, the {room} was closed and its books moved to the Reading Room.\nPage 13: They were moved back when the cold broke. Three were never found.\nPage 14: One of the three turned up a century later, inside a teapot.\nPage 15: Nobody has explained the teapot.\nPage 16: The {room} was the first place in the Archive to be lit by the Lexicon's glow.\nPage 17: Keepers said the light felt like being remembered.\nPage 18: A visiting scholar wrote that the {room} was 'the quietest place in any world'.\nPage 19: Asked which worlds she meant, she would not say.\nPage 20: Under the floor of the {room} there is a second floor. Under that, a third.\nPage 21: Nobody goes below the third floor. Nobody remembers deciding that.\nPage 22: The {room} has been mended eleven times. Each mending is recorded here.\nPage 23: The twelfth mending is not recorded yet. It may be yours.\nPage 24: Records of lost things: one bell, two keys, a hat, a dog (found), a decade (not found).\nPage 25: Records of found things: a map of the {room} that is slightly wrong in a useful way.\nPage 26: The current keeper asks that you not feed the moths.\nPage 27: The moths, the current keeper notes, are fed anyway. By whom is not known.\nPage 28: If the lamps in the {room} dim, it is not the oil. Check the guardian.\nPage 29: This history was last copied by hand. The ink is already fading.\nPage 30: Whoever reads this to the end: write the next page.\n"
        '/archive/reading-room/carrels/{carrel}/{small}': "A few words.\n"
        '/archive/reading-room/carrels/{carrel}/{middle}': "A few more words than that.\nBut not many.\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'Three books in /archive/reading-room/carrels/{carrel}, and the biggest is fading fastest. Find which is biggest and read it.'
    hints:
      - "The long listing shows each book's size."
      - '`ls -l` shows sizes in bytes, just before the date. Then read the biggest.'
      - 'Type: ls -l /archive/reading-room/carrels/{carrel}   then: cat /archive/reading-room/carrels/{carrel}/{big}'
    goal: { read: '/archive/reading-room/carrels/{carrel}/{big}' }
    solution:
      [
        'ls -l /archive/reading-room/carrels/{carrel}',
        'cat /archive/reading-room/carrels/{carrel}/{big}',
      ]

  - id: grimoire-page
    art: [grimoire]
    spells: [man]
    params:
      spell: { pick: [ls, cd, pwd, cat, head, tail, less] }
    brief: 'The Lexicon has forgotten what `{spell}` is for. Open its page in the Grimoire to remind it.'
    hints:
      - 'The Grimoire has a page for every spell.'
      - "`man` and the spell's name. `q` closes the page."
      - 'Type: man {spell}'
    goal: { ran: { command: man, args: ['{spell}'] } }
    solution: ['man {spell}']

  - id: two-halves
    art: [letter]
    spells: [cd, cat]
    params:
      carrel: { pick: [carrel-1, carrel-2, carrel-3, carrel-4, carrel-5, carrel-6] }
      sender: { pick: [Mira, Tobin, the-cook, a-copyist] }
    setup:
      files:
        '/archive/reading-room/carrels/{carrel}/letter-first-half': "Dear Archivist, the lamps on my floor\n"
        '/archive/reading-room/carrels/{carrel}/letter-second-half': "keep going out. Please come quickly. {sender}\n"
    cleanup: ['/archive/reading-room/carrels/{carrel}']
    brief: 'A letter from {sender} was torn in two. Both halves are in /archive/reading-room/carrels/{carrel}. Read them together.'
    hints:
      - 'One spell can read both halves, one after the other.'
      - '`cat` takes more than one name.'
      - 'Type: cd /archive/reading-room/carrels/{carrel}   then: cat letter-first-half letter-second-half'
    goal:
      all:
        - { read: '/archive/reading-room/carrels/{carrel}/letter-first-half' }
        - { read: '/archive/reading-room/carrels/{carrel}/letter-second-half' }
    solution:
      ['cd /archive/reading-room/carrels/{carrel}', 'cat letter-first-half letter-second-half']

  - id: help-reminder
    art: [candle, candle-pair]
    spells: [cat, head, tail, ls]
    params:
      spell: { pick: [cat, head, tail, ls] }
    brief: 'Quick: the Lexicon wants a reminder of the flags `{spell}` takes. Ask the spell itself for help.'
    hints:
      - 'Most spells answer a particular flag with a short summary.'
      - "Add `--help` after the spell's name."
      - 'Type: {spell} --help'
    goal: { ran: { command: '{spell}', args: [--help] } }
    solution: ['{spell} --help']
