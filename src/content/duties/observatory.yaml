# Duties for the Observatory: searching and counting.
templates:
  - id: find-by-name
    art: [magnifier]
    spells: [find, cat]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
      thing: { pick: [brass-key, lost-compass, keepers-glasses, spare-wick, star-chart-index] }
      deep: { byDifficulty: ['shelf', 'shelf/box', 'shelf/box/false-bottom'] }
    setup:
      files:
        '/archive/observatory/workroom/{room}/{deep}/{thing}': "The {thing}. Found at last.\n"
        '/archive/observatory/workroom/{room}/decoy': "Not it.\n"
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: 'The {thing} is somewhere under /archive/observatory/workroom/{room}. Find it and read it.'
    hints:
      - 'Search by name instead of looking room by room.'
      - '`find` with `-name`, then `cat` the path it prints.'
      - 'Type: find /archive/observatory/workroom/{room} -name {thing}   then: cat /archive/observatory/workroom/{room}/{deep}/{thing}'
    goal: { read: '/archive/observatory/workroom/{room}/{deep}/{thing}' }
    solution:
      - 'find /archive/observatory/workroom/{room} -name {thing}'
      - 'cat /archive/observatory/workroom/{room}/{deep}/{thing}'

  - id: which-page
    art: [magnifier, book]
    spells: [grep, cat]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
      word: { pick: [eclipse, aurora, meteor, nova, conjunction] }
      n: { int: [1, 20] }
    setup:
      corpus:
        - dir: '/archive/observatory/workroom/{room}/pages'
          count: 20
          lines: 8
          seed: 77
          plant:
            - { line: 'Tonight: the {word}, plain as day.', files: ['{n}'] }
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: 'One of the twenty pages in /archive/observatory/workroom/{room}/pages mentions the {word}. Find that page and read it.'
    hints:
      - 'Search every page at once for the word.'
      - '`grep -r` or `grep -l` names the page; then read it.'
      - 'Type: grep -rl {word} /archive/observatory/workroom/{room}/pages   then: cat /archive/observatory/workroom/{room}/pages/page-{n}'
    goal: { read: '/archive/observatory/workroom/{room}/pages/page-{n}' }
    solution:
      - 'grep -rl {word} /archive/observatory/workroom/{room}/pages'
      - 'cat /archive/observatory/workroom/{room}/pages/page-{n}'

  - id: grep-the-log
    art: [telescope]
    spells: [grep]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
      place: { pick: [west-sky, east-sky, zenith, harbor] }
      event: { pick: [a falling star, the moth comet, a lantern in the sky, the purring cloud] }
      observer:
        variants:
          - observer: 'juno'
            nights: "Watch 1: Juno on watch, with the good scissors I borrowed from the Reading Room. nothing in the {place}. Clear and cold.\nWatch 2: nothing in the {place}. Cloud by midnight.\nWatch 3: nothing in the {place}, though the owl was restless.\nWatch 4: nothing in the {place}. Tea went cold. So did I.\nWatch 5: nothing. The lens fogged twice. Wiped it with the good cloth.\nWatch 6: nothing in the {place}. Saw my own breath, and that was all.\nWatch 7: nothing in the {place}. The comet keeper used to say nothing is also a sighting.\nWatch 8: nothing worth the ink. Wrote this line anyway.\nWatch 9: nothing in the {place}. A bat, but bats do not count.\nWatch 10: nothing in the {place}. Rain. Closed the dome.\nWatch 11: nothing. Dome stuck half open. Very cold night.\nWatch 12: nothing in the {place}. Fixed the dome. Very proud.\nWatch 13: nothing in the {place}. Heard the bells of the town below, nine of them.\nWatch 14: nothing in the {place}. Counted stars to stay awake. Lost count at four hundred.\nWatch 15: nothing in the {place}, unless you count the moon, which the keepers never do.\nWatch 16: nothing. Fell asleep at the eyepiece. Woke with a ring around my eye.\nWatch 17: nothing in the {place}. Mira came up with soup. Best watch in weeks.\nWatch 18: nothing in the {place}. Fog from the harbor, thick as wool.\nWatch 19: nothing. The fog stayed all night and sang a little.\nWatch 20: nothing in the {place}. Fog gone. Stars very sharp after it.\nWatch 21: nothing in the {place}. Thought I saw something. Did not.\nWatch 22: nothing. Thought I saw something again. Still did not.\nWatch 23: nothing in the {place}. The star charts in the drawer are fading at the edges.\nWatch 24: nothing in the {place}. Recopied the faded charts by lamplight.\nWatch 25: nothing. Ink ran out halfway through Orion. He has one shoulder now.\nWatch 26: nothing in the {place}. New ink. Gave Orion back his shoulder.\nWatch 27: nothing in the {place}. Wind so strong the dome hummed.\nWatch 28: nothing in the {place}. A lantern down in the town went out at midnight.\nWatch 29: nothing. All the lanterns in the town went out at midnight. Odd.\nWatch 30: nothing in the {place}. Lanterns back tonight. Probably the oil.\nWatch 31: nothing in the {place}. Something purring on the stair. Did not go and look.\nWatch 32: nothing in the {place}. Went and looked. Nothing on the stair.\nWatch 33: nothing in the {place}. Long, empty, beautiful night.\nWatch 34: nothing. Clouds like a quilt. Read a book instead. Do not tell the keepers.\nWatch 35: nothing in the {place}. Back at the eyepiece. Faithful again.\nWatch 36: nothing in the {place}. Cold enough that the lens cracked a little. It still works.\nWatch 37: nothing in the {place}. Very still. Felt watched, in a friendly way.\nWatch 38: nothing in the {place}. Last quiet night, if my bones are right.\nWatch 39: nothing yet in the {place}. Waiting.\n"
          - observer: 'brother-ash'
            nights: "Watch 1: Brother Ash at the lens. Owls to my left, stars to my right. Seeing nothing in the {place} as yet.\nWatch 2: nothing in the {place}. The owls have seen something. They will not say what.\nWatch 3: nothing in the {place}. Catalogued owl number forty-one. It catalogued me back.\nWatch 4: nothing. An owl sat on the lens cap for the whole watch. I allowed it.\nWatch 5: nothing in the {place}, but the owls all turned their heads at once at midnight.\nWatch 6: nothing in the {place}. Turned my head at midnight too. Saw nothing. Felt foolish.\nWatch 7: nothing worth a line, but a line costs little.\nWatch 8: nothing in the {place}. Very windy. The owls stayed in.\nWatch 9: nothing in the {place}. Prayed a little. The stars did not mind.\nWatch 10: nothing. Fog. The owls call to each other through it like lanterns.\nWatch 11: nothing in the {place}. Fog lifted. Every star very bright, as if rinsed.\nWatch 12: nothing in the {place}. Wrote a hymn about the fog. It was not good.\nWatch 13: nothing in the {place}. Rewrote the hymn. Somewhat better.\nWatch 14: nothing. Sang the hymn to the owls. One of them left. A critic.\nWatch 15: nothing in the {place}. Cold enough to see my breath and the owls' breath.\nWatch 16: nothing in the {place}. A bat. The owls ate the bat. Nature.\nWatch 17: nothing in the {place}. Tobin came up with a lantern and spoiled my eyes for an hour.\nWatch 18: nothing, as I could not see. Thanks, Tobin.\nWatch 19: nothing in the {place}. Eyes recovered. Very clear.\nWatch 20: nothing in the {place}. Counted the owls instead: fifty-two. Four new.\nWatch 21: nothing. Named the new owls after the four winds.\nWatch 22: nothing in the {place}. North Wind is the loudest.\nWatch 23: nothing in the {place}. The town lanterns went out at midnight, all together.\nWatch 24: nothing. The owls watched the dark town all night. So did I.\nWatch 25: nothing in the {place}. Lanterns back tonight. The owls relaxed.\nWatch 26: nothing in the {place}. Heard purring on the stair. The owls hissed at it.\nWatch 27: nothing. Owls do not hiss at cats. Whatever it is, it is not a cat.\nWatch 28: nothing in the {place}. The star charts in the drawer have faded at the edges.\nWatch 29: nothing in the {place}. Recopied two charts. The owls supervised.\nWatch 30: nothing. Out of ink midway through the Swan. She has one wing tonight.\nWatch 31: nothing in the {place}. New ink. Gave the Swan her wing.\nWatch 32: nothing in the {place}. Long, empty, lovely night.\nWatch 33: nothing. Clouds. Read to the owls. They prefer poetry.\nWatch 34: nothing in the {place}. The lens cracked a hair in the cold. Still true.\nWatch 35: nothing in the {place}. Felt watched, kindly. Not by the owls.\nWatch 36: nothing in the {place}. The owls are restless. So am I.\nWatch 37: nothing yet. Every owl awake and facing the same way.\nWatch 38: nothing yet in the {place}. Waiting, with fifty-two owls.\nWatch 39: nothing in the {place} yet. The owls are holding their breath.\n"
          - observer: 'wren'
            nights: "Watch 1: Wren on watch. I can find a book by its smell. Stars have no smell. Seeing nothing in the {place}.\nWatch 2: nothing in the {place}. The dome smells of brass and cold.\nWatch 3: nothing in the {place}. Brought a book up to read between sweeps. It smells of pine.\nWatch 4: nothing. The book is a sea story. I can smell the salt in its pages, I swear it.\nWatch 5: nothing in the {place}. Lost my keys. Found them in the eyepiece case.\nWatch 6: nothing in the {place}. Lost them again. They were in my hand.\nWatch 7: nothing worth the ink. Wrote it with the cheap ink, then.\nWatch 8: nothing in the {place}. Rain. Closed the dome. The dome smells of rain now.\nWatch 9: nothing. Dome open again. The rain smell stayed.\nWatch 10: nothing in the {place}. Mira came up and read me a page about moths.\nWatch 11: nothing in the {place}. A moth came up after Mira. Coincidence.\nWatch 12: nothing. Counted stars until I could smell the dawn coming. You can, you know.\nWatch 13: nothing in the {place}. Very still. The brass stopped ticking for a while.\nWatch 14: nothing in the {place}. Brass ticking again. I prefer it ticking.\nWatch 15: nothing. Found an old chart rolled in a pipe. Smells of oak gall. Very old.\nWatch 16: nothing in the {place}. The old chart shows a star that is not there any more.\nWatch 17: nothing in the {place}. Or it is there, and we stopped looking.\nWatch 18: nothing. Looked where the old star should be. Nothing. A clean, cold nothing.\nWatch 19: nothing in the {place}. Fog. It smells of the harbor.\nWatch 20: nothing in the {place}. Fog gone. The sky smells of nothing at all, which is the best smell.\nWatch 21: nothing. Thought I saw something. Did not.\nWatch 22: nothing in the {place}. Thought I smelled something. Violet? Can a color smell?\nWatch 23: nothing in the {place}. Found a feather on the sill. Black. Not an owl's.\nWatch 24: nothing. Kept the feather in the old chart's pipe.\nWatch 25: nothing in the {place}. The star charts in the drawer are fading at the edges.\nWatch 26: nothing in the {place}. Recopied by lamplight. The new ink smells of soot.\nWatch 27: nothing. Out of ink in the middle of the Hunter. He has one shoulder tonight.\nWatch 28: nothing in the {place}. Fixed the Hunter.\nWatch 29: nothing in the {place}. The town lanterns went out at midnight. All of them.\nWatch 30: nothing. The dark smelled of snuffed wicks for an hour.\nWatch 31: nothing in the {place}. Lanterns back tonight.\nWatch 32: nothing in the {place}. Something purring on the stair. It smelled of dust and old paper.\nWatch 33: nothing in the {place}. Went down to look. Nothing on the stair but the smell.\nWatch 34: nothing. Clouds. Read the sea story again.\nWatch 35: nothing in the {place}. Cold enough to crack the lens a hair.\nWatch 36: nothing in the {place}. Very still. The air tastes like waiting.\nWatch 37: nothing in the {place}. Whatever is coming, it is close.\nWatch 38: nothing yet.\nWatch 39: nothing yet in the {place}. Keeping my nose to the glass.\n"
    setup:
      files:
        '/archive/observatory/workroom/{room}/watch-log': "{nights}Watch 40: {event} over the {place}.\n"
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: 'Somewhere in the long watch log at /archive/observatory/workroom/{room}/watch-log, someone saw something. Use `grep` to pull out the lines that are not "nothing".'
    hints:
      - 'Search for the lines that do not match.'
      - '`grep -v nothing` prints the lines without the word.'
      - 'Type: grep -v nothing /archive/observatory/workroom/{room}/watch-log'
    goal: { all: [{ ran: grep }, { read: '/archive/observatory/workroom/{room}/watch-log' }] }
    solution: ['grep -v nothing /archive/observatory/workroom/{room}/watch-log']

  - id: count-lines
    art: [ledger]
    spells: [wc]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
      n: { int: [5, 40] }
    setup:
      corpus:
        - {
            dir: '/archive/observatory/workroom/{room}',
            count: 1,
            name: 'ledger',
            lines: '{n}',
            seed: 3,
          }
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: 'The ledger at /archive/observatory/workroom/{room}/ledger needs a line count for the records. Count its lines.'
    hints:
      - 'Count, do not read.'
      - '`wc -l` counts lines.'
      - 'Type: wc -l /archive/observatory/workroom/{room}/ledger'
    goal: { all: [{ ran: wc }, { read: '/archive/observatory/workroom/{room}/ledger' }] }
    solution: ['wc -l /archive/observatory/workroom/{room}/ledger']

  - id: tally
    art: [owl]
    spells: [sort, uniq]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
    setup:
      files:
        '/archive/observatory/workroom/{room}/sightings': "owl\nmoth\nowl\nbat\nmoth\nowl\ncomet\nowl\nmoth\nbat\nowl\n"
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: 'Tally the sightings in /archive/observatory/workroom/{room}/sightings: how many of each creature?'
    hints:
      - 'Put equal lines together, then count each run.'
      - '`sort` the file, then pipe it to `uniq -c`.'
      - 'Type: sort /archive/observatory/workroom/{room}/sightings | uniq -c'
    goal:
      {
        all:
          [
            { ran: sort },
            { ran: { command: uniq, args: ['-c'] } },
            { read: '/archive/observatory/workroom/{room}/sightings' },
          ],
      }
    solution: ['sort /archive/observatory/workroom/{room}/sightings | uniq -c']

  - id: sort-roster
    art: [star-chart]
    spells: [sort]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
    setup:
      files:
        '/archive/observatory/workroom/{room}/roster': "Wren\nAsh\nMira\nTobin\nHolt\nBrill\n"
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: "The keepers' roster in /archive/observatory/workroom/{room}/roster is out of order. Show it sorted."
    hints:
      - 'There is a spell that orders lines.'
      - '`sort` the roster.'
      - 'Type: sort /archive/observatory/workroom/{room}/roster'
    goal: { all: [{ ran: sort }, { read: '/archive/observatory/workroom/{room}/roster' }] }
    solution: ['sort /archive/observatory/workroom/{room}/roster']

  - id: clear-blank-pages
    art: [moon]
    spells: [find, rm]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
    setup:
      files:
        '/archive/observatory/workroom/{room}/notes/blank-1': ''
        '/archive/observatory/workroom/{room}/notes/blank-2': ''
        '/archive/observatory/workroom/{room}/notes/real-note': "A real observation. Keep this.\n"
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: 'lionX left blank pages among the notes in /archive/observatory/workroom/{room}/notes. Find the empty ones and remove them. Keep the real note.'
    hints:
      - 'There is a test for empty books.'
      - '`find` with `-empty -type f` lists them; `rm` removes them.'
      - 'Type: find /archive/observatory/workroom/{room}/notes -empty -type f   then: rm /archive/observatory/workroom/{room}/notes/blank-1 /archive/observatory/workroom/{room}/notes/blank-2'
    goal:
      all:
        - { missing: '/archive/observatory/workroom/{room}/notes/blank-1' }
        - { missing: '/archive/observatory/workroom/{room}/notes/blank-2' }
        - { isFile: '/archive/observatory/workroom/{room}/notes/real-note' }
    solution:
      - 'find /archive/observatory/workroom/{room}/notes -empty -type f'
      - 'rm /archive/observatory/workroom/{room}/notes/blank-1 /archive/observatory/workroom/{room}/notes/blank-2'

  - id: gather-mentions
    art: [constellation]
    spells: [grep, mkdir, mv]
    params:
      room: { pick: [north-dome, south-dome, map-loft, clock-room, lens-room] }
      word: { pick: [Mira, Tobin, the-keeper] }
      a: { int: [1, 6] }
      b: { int: [7, 12] }
    setup:
      corpus:
        - dir: '/archive/observatory/workroom/{room}/letters'
          count: 12
          name: 'letter-{#}'
          lines: 6
          seed: 9
          plant:
            - { line: 'Signed, {word}.', files: ['{a}', '{b}'] }
    cleanup: ['/archive/observatory/workroom/{room}']
    brief: 'Two of the letters in /archive/observatory/workroom/{room}/letters were signed by {word}. Gather them into a new room there called from-{word}.'
    hints:
      - 'Search for the signature, listing only the letters. Then make a room and move them.'
      - '`grep -l` lists the letters; `mkdir` and `mv` gather them.'
      - 'Type: grep -l "Signed, {word}" -r /archive/observatory/workroom/{room}/letters   then: mkdir /archive/observatory/workroom/{room}/from-{word}   then: mv /archive/observatory/workroom/{room}/letters/letter-{a} /archive/observatory/workroom/{room}/letters/letter-{b} /archive/observatory/workroom/{room}/from-{word}/'
    goal:
      all:
        - { isFile: '/archive/observatory/workroom/{room}/from-{word}/letter-{a}' }
        - { isFile: '/archive/observatory/workroom/{room}/from-{word}/letter-{b}' }
    solution:
      - 'grep -l "Signed, {word}" -r /archive/observatory/workroom/{room}/letters'
      - 'mkdir /archive/observatory/workroom/{room}/from-{word}'
      - 'mv /archive/observatory/workroom/{room}/letters/letter-{a} /archive/observatory/workroom/{room}/letters/letter-{b} /archive/observatory/workroom/{room}/from-{word}/'
