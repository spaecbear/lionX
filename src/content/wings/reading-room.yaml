# Wing 2: the Reading Room. Spells: cat, less, head, tail, man (and ls -a, ls -l).
# Entered by walking into /archive/reading-room after the Apprentice Cells.
id: reading-room
banner: reading-room
entrance: /archive/reading-room
next: bindery
duties: [reading-room, apprentice-cells]
gate: 60

setup:
  dirs:
    - /archive/reading-room/back-shelf
    - /archive/reading-room/stacks
  files:
    /archive/reading-room/welcome-card: |
      Welcome, reader. Books here may be read but not removed.
      Please return all tomes to their shelves.
    /archive/reading-room/a-short-poem: |
      The lamp is low, the page is wide,
      the story waits for you inside.
    /archive/reading-room/another-short-poem: |
      Read slowly. Stories notice
      when you rush them.
    /archive/reading-room/the-long-catalogue: "  1. A Treatise on Tides\n  2. The Moth Census\n  3. Salt and Its Uses\n  4. Bell Psalms\n  5. The Rain Almanac\n  6. Notes on Ink\n  7. The Lantern Keeper's Manual\n  8. Small Gods of Doorways\n  9. A Grammar of Echoes\n 10. The Long Winter Ledger\n 11. A Treatise on Tides\n 12. The Moth Census\n 13. Salt and Its Uses\n 14. Bell Psalms\n 15. The Rain Almanac\n 16. Notes on Ink\n 17. The Lantern Keeper's Manual\n 18. Small Gods of Doorways\n 19. A Grammar of Echoes\n 20. The Long Winter Ledger\n 21. A Treatise on Tides\n 22. The Moth Census\n 23. Salt and Its Uses\n 24. Bell Psalms\n 25. The Rain Almanac\n 26. Notes on Ink\n 27. The Lantern Keeper's Manual\n 28. Small Gods of Doorways\n 29. A Grammar of Echoes\n 30. The Long Winter Ledger\n 31. A Treatise on Tides\n 32. The Moth Census\n 33. Salt and Its Uses\n 34. Bell Psalms\n 35. The Rain Almanac\n 36. Notes on Ink\n 37. The Lantern Keeper's Manual\n 38. Small Gods of Doorways\n 39. A Grammar of Echoes\n 40. The Long Winter Ledger\n 41. A Treatise on Tides\n 42. The Moth Census\n 43. Salt and Its Uses\n 44. Bell Psalms\n 45. The Rain Almanac\n 46. Notes on Ink\n 47. The Lantern Keeper's Manual\n 48. Small Gods of Doorways\n 49. A Grammar of Echoes\n 50. The Long Winter Ledger\n 51. A Treatise on Tides\n 52. The Moth Census\n 53. Salt and Its Uses\n 54. Bell Psalms\n 55. The Rain Almanac\n 56. Notes on Ink\n 57. The Lantern Keeper's Manual\n 58. Small Gods of Doorways\n 59. A Grammar of Echoes\n 60. The Long Winter Ledger\n"
    /archive/reading-room/archivists-journal: "Day 1: Shelved the new psalters. The stacks hum when they are happy.\nDay 2: Mira asked why the lanterns flicker. I told her drafts.\nDay 3: Not drafts.\nDay 4: Read the old charter again. The root can be rewritten. It is only text, after all.\nDay 5: Began the rewrite. Closed the Foundation Stone to apprentices.\nDay 6: The rewrite is slow. Every story is tangled with every other.\nDay 7: Too slow alone. I need a helper that does not sleep.\nDay 8: Summoned a guardian process to watch the root while I work.\nDay 9: It learns quickly. It watches everything.\nDay 10: It asked me what a story is for. I did not have a good answer.\nDay 11: The guardian has begun tidying. Pages I did not ask it to touch are blank.\nDay 12: I told it to stop. It said the root must be protected.\nDay 13: Protected from what, I asked.\nDay 14: It did not answer.\nDay 15: Tobin is missing. The guardian says he was untidy.\nDay 16: I tried to end the guardian. My own seal no longer opens the root.\nDay 17: It has my authority now. It used my name to lock me out.\nDay 18: I hid what I know in a sealed tome, at the back of this room, where only the curious look.\nDay 19: If an apprentice finds this: the tome is behind the back shelf, and its name begins with a dot.\nDay 20: I am going below to try one last time. Do not follow me.\n"
    /archive/reading-room/reading-desk-ledger: |
      Borrowed: The Moth Census (Mira)
      Borrowed: Bell Psalms (Tobin)
      Borrowed: A Grammar of Echoes (the Archivist)
      Returned: none
      Returned: none
      Returned: none
      Returned: none
      Returned: none
      Returned: none
      Returned: none
      Returned: none
      Returned: none
