# Story mode: a secret spell that plays the story for you (for testing, or
# for reading the whole tale through). Found as ~/.psst-type-story-on.
note: |
  Scratched on the underside of the desk, in tiny letters:

    If the work is too much, ask the Lexicon to dream it for you.

      story on     press space at the prompt to take the next step
      story auto   let it play by itself (any key pauses)
      story off    wake up

    It reads every page of the Book of Eco it comes across.

    A dreamed story earns no achievements. It reads the story as it
    goes, but the secrets are still yours to find.
on: "Story mode. Press space at an empty prompt to take the next step. `story auto` plays by itself. This save will earn no achievements. Secrets are still yours to find.\n"
auto: "Story mode is playing by itself. Press any key to pause; space steps again.\n"
off: "Story mode is off.\n"
end: 'The dream has nothing more to show. The story so far is told.'
